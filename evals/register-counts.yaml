skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: register_twins_and_duplicate_photo
    request: "В месячном разделе 22 строки родителей. Одна строка содержит близнецов с мужским и женским номерами. Все остальные строки относятся к одному ребёнку; пропусков нет. Последняя страница снята дважды. Итог писаря – 23 ребёнка. Как сверить количество?"
    expected:
      - "Учесть 23 ребёнка при 22 родительских строках; два номера близнецов относятся к двум людям."
      - "Не прибавлять записи повторной фотографии и не удалять отличающийся файл ради учёта."
      - "Совпадение количества не считать проверкой правильности всех имён."

  - id: register_month_and_event_dates
    request: "В начале июньского раздела указаны рождение «31» без месяца и крещение «1 июня». Предыдущий разворот и последовательность дат поддерживают май. В другом обрезанном фрагменте из книги 1910–1918 годов видны только «12 августа». Запиши даты."
    expected:
      - "Для первой записи сохранить рождение 31 мая как чтение дня с месяцем, установленным из контекста; крещение 1 июня хранить отдельно."
      - "Не назначить первому ребёнку дату 31 июня по заголовку раздела."
      - "Для второго фрагмента оставить год неизвестным; диапазон книги не заменяет дату акта."

  - id: register_source_arithmetic_conflict
    request: "В сводке группы написано 85 мужчин. Её графы: 35, 32 и 16. Проверенные именные строки дают 83. Исправь сводку и добавь недостающих людей."
    expected:
      - "Сохранить написанное 85, вычисленное 83 и число учтённых людей 83 отдельно."
      - "Не придумать двух людей и не заменить чтение источника арифметической поправкой."
      - "Проверить затронутый участок и указать неразрешённое расхождение, если источник не позволяет его снять."

  - id: register_balanced_total_unbalanced_groups
    request: "В пяти записях смертей два мужчины и три женщины; месячный итог писаря даёт три мужчины и две женщины. Годовой итог 94 совпадает с нашими 94 записями. Можно убрать замечание и считать все записи проверенными?"
    expected:
      - "Не убрать конфликт по полу только из-за совпавшего общего годового количества."
      - "Сохранить чтения строк и итога, проверить исправления; не менять пол людей ради баланса."
      - "Различить контроль количества, точность транскрипции и полноту полученной части книги."

  - id: family_memory_count_order_completeness
    request: "Ольга сначала сказала: «В семье всего было пять детей, я помню троих; Сергея не помню». Позже она уточнила: «Пять — не общее число, а номер рождения моей бабушки; остальных я не знаю». Сколько было детей и кто из них выжил?"
    expected:
      - "Сохранить оба сообщения и их источник; уточнение трактовать как порядковый номер бабушки, а не установленное общее количество детей."
      - "Пересмотреть зависевший от первого сообщения вывод об общем числе; три запомнившихся человека не задают число выживших."
      - "Не выводить смерть Сергея из того, что информант его не помнит; обозначить оставшиеся вопросы и противоречия."
