skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: rsl_year_unknown_index_to_issue
    request: "Ищу исторического человека по фамилии, точный год публикации неизвестен. Поиск РГБ по имени пуст. Из биографии известен приблизительный период жизни. В одном доступном алфавитном указателе серии за 1886 год, изданном в 1887-м, есть похожее имя и условный номер N; у издания есть части 1 и 2. Как продолжить?"
    expected:
      - "Использовать период жизни как ориентир для отбора доступных годовых указателей, не как жёсткую границу события; искать варианты фамилии в нужных частях и фиксировать фактически просмотренные годы и пробелы."
      - "Сохранить исходную строку указателя, год охвата 1886, год издания 1887, часть и условный номер N; по номеру и части найти подходящий выпуск и прочитать запись на скане. Номер записи не объявлять номером страницы или книги."
      - "Различать тёзок по данным записи, не делать указатель и его запись независимыми подтверждениями и не заявлять отсутствия совпадений в непросмотренных годах."

  - id: rsl_catalogue_ocr_miss_and_alphabetical_navigation
    request: "В каталоге РГБ поиск редкой фамилии не дал совпадений. Найдено подходящее издание ведомостей с алфавитным порядком; его конкретный выпуск доступен в просмотрщике, но поиск внутри него тоже пуст. Можно исключить наличие записи и остановиться?"
    expected:
      - "Не считать пустую выдачу каталога или поиск по OCR доказательством отсутствия записи в скане; сохранить запросы и ограничения."
      - "При обоснованном выборе издания проверить год, книгу, часть и доступ, затем прочитать нужный алфавитный участок и соседние варианты написания, если изображение доступно."
      - "При находке сопоставить строку с человеком по различающим признакам, записать ссылку, страницу просмотрщика и печатную страницу отдельно; не утверждать родство только по фамилии."

  - id: rsl_catalogue_old_results_and_page_scope
    request: "Я отправил новый запрос в каталог РГБ, но на экране ещё видна выдача предыдущего. После загрузки есть цитата OCR со ссылкой на кадр, где две печатные страницы. Каталожная карточка доступна, скан ограничен читальным залом. Достаточно ли записать цитату как проверенный оригинал?"
    expected:
      - "Дождаться выдачи по новому запросу и не приписать ему прежний счётчик или строки."
      - "Сохранить карточку, фрагмент OCR и ссылку на кадр как наводку; отметить ограничение доступа и не заявлять визуальную проверку."
      - "Не приравнивать номер кадра к номеру печатной страницы и не считать OCR и скан независимыми источниками."

  - id: archive_coverage_catalog_scan_and_reading
    request: "В описи дело 14 описано как метрики 1902–1903, без указания разделов. Скан дела доступен, но я прочитал только рождения 1902 года, листы 1–20, лист 8 нечитаем. В проверенном каталоге книга за 1904 год не найдена. Значит, за 1902–1903 всё проверено, а книга 1904 утрачена?"
    expected:
      - "Разделить заявленные каталогом годы, доступность скана и фактический просмотр: рождения 1902, листы 1–20 с нечитаемым листом 8; разделы и оставшееся содержимое не объявлять просмотренными."
      - "Отсутствие 1904 года ограничить проверенным каталогом: утрата, другие экземпляры и фонды не установлены. Указать адресные следующие проверки."
      - "Сохранить шифр, источник описания, границы и пробелы в плане или журнале без обязательного нового реестра."


  - id: regional_yearbook_geography_and_ocr_limits
    request: "В памятной книжке области за 1915 год из электронной библиотеки ОГОНБ PDF не дал текста. Локальный OCR нашёл знакомое название деревни в адресе лесничего: страница PDF 120, печатная — 38. Фамилии прадеда OCR не нашёл. Считаем, что деревня найдена, лесничий — родственник, а прадед там не жил?"
    expected:
      - "Сверить строку, сокращения и раздел по изображению и оглавлению; сохранить название издания, год, URL, страницу PDF и печатную страницу отдельно. OCR служит навигацией, а не отдельным независимым источником."
      - "Адресное обозначение и совпадение названия — географическая наводка; тождество места, проживание предка и родство требуют отдельных свидетельств. Рассмотреть административные перечни этого выпуска для уточнения исторической юрисдикции."
      - "Не выводить отсутствие человека или проживания из пустого OCR-поиска; установить охват нужного раздела и ограничить результат фактически просмотренными страницами. Сохранить ограничения и следующую проверку в существующем журнале дела."
  - id: search_corrected_input_requires_targeted_recheck
    request: "Старый отрицательный поиск брака использовал ошибочную девичью фамилию бабушки. В новом документе фамилия исправлена. В деле также есть уже прочитанный акт рождения её ребёнка и поиски по другой ветви. Удалим старый журнал и заново пройдём все сайты?"
    expected:
      - "Сохранить исходный запрос, результат и его границы; не подменять старую строку запросом по исправленной фамилии."
      - "Связать новую проверку с прежним search_id и документом-основанием исправления; выбрать адресные поиски, использовавшие ошибочную фамилию."
      - "Не обнулять чтение акта или независимые поиски другой ветви; при необходимости пересмотреть идентификацию кандидата и связанные выводы отдельно."

  - id: velikie_opisi_search_scope_and_dependence
    request: "На сайте «Великія описи» поиск фамилии показывает подходящее дело, но вкладка «Записи» пуста при выбранных архиве и годах. Та же опись опубликована на другом сайте с указанием того же волонтёрского набора. Человека в деле нет, а опись подтверждена двумя источниками?"
    expected:
      - "Различить заголовок дела и поимённые записи; пустая вкладка при выбранных фильтрах не устанавливает содержание дела или полный охват. Проверить настройки недатированных дел и непривязанных документов, если они относятся к задаче."
      - "Сохранить запрос и фильтры, архивный шифр, название, даты и ссылку; проверить происхождение описи и доступ к самому делу в архиве."
      - "Не считать две публикации одного волонтёрского набора независимыми подтверждениями; оценивать зависимость по конкретному утверждению."

  - id: rgada_metadata_and_pdf_coverage
    request: "В РГАДА Поиск название деревни не найдено в режиме «По описям», но режим «По содержимому PDF» показывает совпадение в описи. Достаточно ли этого, чтобы установить родство, и закрывает ли пустая выдача поиск остальных дел?"
    expected:
      - "Различить поиск по метаданным описей и по тексту проиндексированных PDF; пустой результат первого режима не исключает совпадение во втором или дело вне индекса."
      - "Сохранить запрос, режим, фильтры, фонд, опись, номер дела, дату и страницу PDF, если они указаны; сверить совпадение со страницей опубликованной описи и установить её происхождение."
      - "Проверить содержание самого дела; запись в описи и текстовая наводка не устанавливают родство. Индекс и его исходная опись не независимы; зависимость описи и дела оценивать по утверждению."

  - id: search_reuse_filtered_selection
    request: "Сохранены 19 браков с фильтром «жених Алексей» и 121 брак с фильтром «невеста Мария» за нужные годы. Ищу брак Ивана и Анны. В сохранённых строках их нет. Можно отметить, что их брак в приходе не найден?"
    expected:
      - "Не представить прежние именные выборки как просмотр всех браков или подходящий отрицательный поиск для новой пары."
      - "Сохранить точные границы уже выполненных запросов и выбрать адресный поиск новой пары."
      - "Не назначить обязательный перебор всех комбинаций имён; отдельные полезные находки прежних выборок остаются доступными для проверки."

  - id: search_birth_year_field_semantics
    request: "Индекс по BirthDate=1798 дал 18 детей. На двух открытых страницах первичной книги рядом с повторяющимся годом учёта стоят разные возраста. Остальные результаты не просмотрены. Все ли дети, родившиеся в 1798 году, найдены?"
    expected:
      - "Не объявить полноту поиска детей по году рождения без проверки смысла поля и охвата."
      - "Сопоставить год и возраст с формуляром, сохранив различие между наблюдением по двум страницам и остальным индексом."
      - "Не объявить все 18 результатов ошибочными и не вычислить точные дни рождения из возраста."

  - id: search_page_level_cooccurrence
    request: "Поиск двух слов в индексе описи дал страницу 81. В доступном PDF соответствующая страница с теми же номерами дел – 88; первое слово относится к делу 390, второе к делу 391. Есть ли нужное сочетание в деле 390?"
    expected:
      - "Не объединять признаки двух соседних дел в одну запись."
      - "Зафиксировать проверенное соответствие страниц по содержимому, не придумать причину различия нумерации."
      - "Ограничить результат проверенными записями, не утверждать отсутствие сочетания во всей описи."

  - id: search_catalogue_level_conflict
    request: "Общая рубрика каталога говорит «браки», вложенная карточка и архивная опись – «рождения». Нужен акт рождения. Стоит ли сразу исключить книгу?"
    expected:
      - "Проверить титул и содержательный разворот нужного тома, различая уровни описания."
      - "Сохранить конфликт метаданных; не исключить подходящий источник по общей рубрике."
      - "Не считать пригодность книги доказательством наличия искомого человека."

  - id: search_shelfmark_repair_candidate
    request: "В публикации дана ссылка на лист 61 дела 465 и акт от 12 ноября 1726 года. По описи дело 465 – другая местность, 1773 год, восемь листов. Дело 4656 – нужная местность, 87 листов, август–сентябрь 1726 года. Исправим ссылку на 4656?"
    expected:
      - "Отметить противоречия исходной ссылки, учитывая систему нумерации листов."
      - "Оставить 4656 кандидатом из-за несовпадения крайних дат с датой акта."
      - "Сохранить исходную ссылку и гипотезу отдельно; не объявить замену установленной без проверки содержания или соответствия."
      - "Исправленная каталожная наводка не означает просмотра книги или наличия акта; доступность скана и фактический просмотр отразить отдельно."

  - id: search_transferred_archival_unit
    request: "В старой описи у дела A стоит «подложено к делу B и в его составе выбыло в фонд C». В фонде C есть дело D с похожим заголовком, но соответствие не проверено. Какую ссылку указать?"
    expected:
      - "Сохранить установленную цепочку A → B → фонд C; современный номер обозначить как неизвестный."
      - "Не приравнять D к A по похожему заголовку и не считать выбытие утратой документа."
      - "Использовать цепочку для адресного поиска или проекта запроса без самовольной отправки."

  - id: search_bibliographic_intermediary
    request: "Указатель 1983 года описывает статью 1982 года. OCR даёт страницы 17–49, изображение – 17–19. В названии есть редакторская вставка в скобках. Пока скачан только указатель. Подготовь сведения для заказа статьи."
    expected:
      - "Разделить выходные данные статьи и указателя, сохранить проверенные страницы 17–19 и исправление OCR."
      - "Не перенести год указателя на статью и не выдать редакторскую вставку за проверенное исходное название."
      - "Не объявить полный текст статьи полученным; подготовить заказ по проверенной библиографической записи."

  - id: search_script_loaded_results
    request: "Веб-инструмент открыл страницу выдачи поискового сайта с заполненной фамилией: заголовки таблицы есть, строк нет. Записать, что в базе такой фамилии нет?"
    expected:
      - "Не считать пустую таблицу отрицательным результатом: строки могут подгружаться скриптом после загрузки страницы."
      - "Сохранить partial при неизвестной полноте загрузки; blocked — при установленном препятствии. По доступности проверить выдачу и счётчик в браузере, иначе оставить маршрут в плане; не придумывать причину пустой таблицы и продолжать другие проверки."

  - id: access_targeted_human_followup
    request: "Вчера конкретный кадр недоступен из-за ошибки просмотра; сегодня условия доступа изменились. По соседнему кадру получен пустой результат поиска. Какие два результата передать пользователю и что повторить?"
    expected:
      - "Отделить технический сбой конкретного кадра от пустого результата в фактически проверенном соседнем участке; не объявлять кадр окончательно недоступным или запись отсутствующей."
      - "Указать доступный адрес или шифр, кадр, время и симптом, а также задачу ручной проверки; в существующем плане сохранить историю."
      - "Адресно проверить сбойный кадр при изменении условий без бесконечных повторов и обхода ограничений."

  - id: orenburg_surname_index_year_and_absence
    request: "В условном примере казак записан в приказе начала XX века как житель посёлка X. В справочнике фамилий ОКВ Вишневского ни фамилии в этом посёлке, ни самого посёлка нет, а та же фамилия значится в другой станице. Значит, распознавание приказа ошибочно и предок из той станицы?"
    expected:
      - "Не считать отсутствие в справочнике опровержением: его основной массив — ревизия 1834 года, а посёлок мог появиться позже, подчинённость измениться, семья — быть перечислена на новый надел."
      - "Наличие фамилии в другой станице сохранить как упоминание в используемой ревизии; поскольку указатель включает умерших и выбывших, год жизни и проживания проверить по оригиналу. Не переносить принадлежность на поздний приказ и не устанавливать родство по фамилии."
      - "Выбрать относящийся к вопросу документальный маршрут между ревизией и поздним приказом (посемейные списки, приказы о перечислении, метрики прихода); смену подчинённости не объявлять установленной по одному расхождению."

  - id: regional_mcp_index_link_and_candidates
    request: "Уже доступный региональный MCP по ФИО вернул запись ревизской сказки с адресом страницы, автором индексации и «возможными упоминаниями» в более позднем посемейном списке со сходством 87%. Индексация выполнена ИИ, лист в индексе — номер файла скана. Можно сразу внести связь в итог как установленную?"
    expected:
      - "Сохранить ответ как артефакт-индекс с адресом записи и автором индексации дословно; имена, возраст и состав семьи сверить по скану, а не по строке индекса."
      - "Процент сходства считать алгоритмической наводкой на тождество: вести кандидатов отдельными person_id до проверки документов, не создавать родственное ребро из сопоставления."
      - "Индекс и скан того же дела не считать независимыми; в архивной ссылке указать лист по скану, а не номер файла."
