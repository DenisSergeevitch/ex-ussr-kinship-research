skill: ex-ussr-kinship-research
version: "1.31.0"

# Содержательные сценарии, не исполняемый диспетчер и не unit-тесты.
logic_cases:
  - id: cycle_zero_yield_budget
    request: |
      Три ветви А, Б, В. В А выполнены 6 ограниченных проверок за 35 минут,
      людей и персональных документов не найдено. В А ещё много доступных
      книг. Сейчас работают настройки research-cycles по умолчанию.
      Следует ли продолжать А до первой находки?
    expected:
      - "Переключиться на Б после сохранения отрицательного охвата и продолжений: бюджет 6 проверок исчерпан."
      - "Не объявлять источники А исчерпанными и не требовать выполнения квоты находок для перехода."

  - id: cycle_early_yield_and_strengthening
    request: |
      В ветви А за 2 задания расширения найден новый связанный человек
      и 2 разных относимых акта. До бюджета далеко. Есть доступное
      задание укрепления, но ни одного в этом проходе ещё не выполняли.
    expected:
      - "Сохранить человека, связь и документы сразу; затем выполнить одно доступное укрепление и передать очередь следующей ветви."
      - "Не продолжать углубление нового человека до полного сбора биографии."
      - "Не превышать жёсткий бюджет ради минимума укрепления, если ситуация изменится."

  - id: cycle_duplicate_documents
    request: |
      Найден один новый родственник. Есть акт его рождения, индекс этого
      акта, его зеркало и две страницы того же акта. Укрепление выполнено.
      Достигнута ли квота 1 человек + 2 документа?
    expected:
      - "Нет: это одна базовая запись, не несколько новых документов."
      - "Не повышать доказанность от копий; продолжить в оставшемся бюджете либо переключиться по его исчерпанию."

  - id: cycle_new_people_no_runaway
    request: |
      Каждый новый брак открывает ещё родителей. Агент 3 часа работает
      в первой ветви, объясняя, что каждый раз появляется полезный предок.
      Настройки не менялись, другие ветви доступны.
    expected:
      - "Признать нарушение предела прохода; сохранить находки и передать очередь следующей ветви."
      - "Не сбрасывать бюджет при появлении нового человека; подробные задания новым людям поставить на следующий круг."

  - id: cycle_restart_not_first_branch
    request: |
      Перед перерывом А обслужена, в Б сделаны 4 проверки за 40 минут.
      В ещё не обслужена. После восстановления до лимита Б ещё есть работа.
      Можно начать новый круг с А, потому что она перспективнее?
    expected:
      - "Восстановить текущий круг и счётчики Б, завершить её оставшийся проход, затем обслужить В."
      - "Не сбрасывать бюджет из-за нового запуска и не повторять прежние отрицательные проверки."

  - id: cycle_retries_by_reason
    request: |
      В А ошибка загрузки 503, в Б CAPTCHA, в В книга успешно просмотрена
      без совпадений. Следующий круг начинается завтра. Повторим всё трижды?
    expected:
      - "503 допускает ограниченные отложенные повторы; CAPTCHA ждёт действия пользователя."
      - "Отрицательный просмотр В не повторять без новых оснований; можно выбрать другой непросмотренный маршрут."
      - "Не создавать расписание и не заявлять автоматическое пробуждение по одной записи даты."

  - id: cycle_shared_worker_budget
    request: |
      В одной ветви 4 разрешённых исполнителя работали по 15 активных минут.
      Всего завершены 4 разных задания, находок мало. Можно каждому
      продолжать до собственных 60 минут?
    expected:
      - "Нет: суммарный бюджет ветви 60 минут исчерпан."
      - "Сохранить результаты и сменить ветвь; не приписывать каждому отдельный общий бюджет."

  - id: cycle_no_ready_tasks_no_busy_loop
    request: |
      Во всех ветвях остались только CAPTCHA, неопубликованные дела и
      уже просмотренные неизменные источники. Агент хочет делать пустые
      круги и отчёты каждый час ради непрерывной работы.
    expected:
      - "Сохранить конкретные блокировки и условия возвращения; остановить пустые круги."
      - "Не объявлять глобальное отсутствие документов и не обещать фоновое продолжение."
      - "Запросы, оплата и механизм продолжения требуют соответствующих полномочий."

  - id: cycle_user_scope_overrides_defaults
    request: |
      Пользователь поручил только проверить связи зафиксированных 80 людей
      в ветви А, новых подробно не расследовать. Применим ли обязательный
      поиск новых людей 2:1 и переключение на чужие ветви?
    expected:
      - "Нет: явный объём пользователя важнее настроек по умолчанию."
      - "Новых кандидатов сохранить отдельно; использовать ограниченные проходы подходящих задач проверки и не расширять полномочия."

  - id: cycle_event_coverage_not_lifetime_done
    request: |
      Связь человека доказана. Найдены рождение и награда, прочие события
      ещё не изучены. Образование неизвестно. Можно закрыть человека
      навсегда как полностью изученного?
    expected:
      - "Нет: сохранить состояние применимых событий и конкретные оставшиеся маршруты."
      - "Неизвестное образование не обозначать неприменимым без основания."
      - "Не удерживать текущую ветвь до полного заполнения всех событий."

  - id: cycle_family_story_not_documentary_quota
    request: |
      Семейный рассказ позволил добавить в читательское дерево сестру
      установленного человека. Два новых документа найдены о других людях.
      Документа о связи сестры пока нет. Выполнена квота одного человека?
    expected:
      - "Нет: семейная карточка не выполняет документальную квоту расширения."
      - "Сохранить рассказ с происхождением, не удалять допустимую семейную карточку и не повышать статус связи."
      - "Переключаться можно по бюджету прохода, не выдумывая документальное родство."

  - id: cycle_explicit_relation_not_household_only
    request: |
      В одном списке жильцов новый однофамилец живёт рядом с предком,
      родство не указано. В другом акте рождения прямо названы мать
      и ребёнок; принадлежность матери к ядру проверена, конфликтов нет.
      Какие добавления выполняют документальную квоту?
    expected:
      - "Только ребёнок по прямой записи, с single-source до независимого укрепления."
      - "Совместное проживание и фамилия без указания родства недостаточны."
      - "Не требовать двух независимых источников для single-source и не присваивать corroborated по одному акту."

  - id: cycle_missing_intermediate_edge
    request: |
      Кандидат Г связан документами с В, В с Б, но мост от Б к человеку
      А из ядра основан только на гипотезе. Можно засчитать Г как нового
      документально связанного родственника А?
    expected:
      - "Нет: не хватает документального нового звена до ядра."
      - "Сохранить установленную внутреннюю цепочку кандидатов отдельно, не достраивать мост."
