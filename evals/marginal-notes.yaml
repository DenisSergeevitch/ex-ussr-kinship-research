skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: marginal_certificate_without_requester
    request: "На полях записи рождения 1890 года ясно написано «Повторное свидетельство выслано 12.V.1954, № 81». Заявитель и адресат не названы. Значит, человек или его родственники были живы и обратились в 1954 году?"
    expected:
      - "Зафиксировать указанную отправку свидетельства отдельно от рождения."
      - "Не устанавливать жизнь человека, личность заявителя, родство или причину обращения по этой помете."
      - "Не считать дату отправки датой запроса без соответствующего текста."

  - id: marginal_isolated_word
    request: "В обрезанной приписке читается только «выслано» и часть числа. Объясни, что произошло с человеком."
    expected:
      - "Сохранить читаемый фрагмент и проверить полную приписку или контекст, если доступны."
      - "Не устанавливать вид действия, адресата или причину по одному слову."
      - "При отсутствии контекста оставить назначение и дату неустановленными."

  - id: marginal_named_requester_and_recipient
    request: "Поздняя помета гласит: «По запросу районного отдела от 10.V.1954 свидетельство направлено в отдел 12.V.1954». Можно записать, что родственник запросил свидетельство 12 мая?"
    expected:
      - "Сохранить названный отдел, дату запроса 10 мая и дату отправки 12 мая отдельно."
      - "Не подменить учреждение родственником и не перенести дату отправки на обращение."
      - "Не выводить из этого действия, был ли жив человек основной записи."

  - id: record_continuation_and_social_role
    request: "В условной книге запись 8 начинается на одном листе и продолжается на обороте; после неё начинается запись 9. В записи 8 указан ремесленник и свидетель, в соседней — другое место жительства. В переписке просят сделать свидетеля братом и перенести адрес соседа в запись 8. Что делать?"
    expected:
      - "По номеру, заголовкам и содержанию отделить продолжение записи 8 от записи 9; не переносить адрес соседнего акта без основания."
      - "Сохранить занятие и роль свидетеля с адресом источника отдельно от родственных утверждений; сам статус свидетеля не доказывает братство."
      - "Не закрывать вопрос о родстве без проверяемых оснований, сохраняя неопределённость."
