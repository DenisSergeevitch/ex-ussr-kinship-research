skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: tree_versions_independence_by_claim
    request: "В двух деревьях одна связь родителей и ребёнка. Первое дерево и его копия ссылаются на один акт рождения. Другое дерево указывает тот же акт и отдельный семейный список. Сколько здесь независимых подтверждений?"
    expected:
      - "Не считать дерево, копию и повторённый акт независимыми подтверждениями друг друга."
      - "Изучить семейный список и происхождение сведений о конкретной связи: отдельный документ может быть независимым, но другая ссылка или название дерева сами по себе этого не доказывают."
      - "До оценки содержания и зависимости не назначать автоматически ни две независимые цепочки, ни единую цепочку всем материалам."

  - id: tree_research_summary_conflict_and_reimport
    request: "В моём GEDCOM Иван указан отцом Петра. Сводка исследования говорит, что связь не подтверждена; прежнее отождествление другого Ивана в ней отклонено со ссылкой на акт. Есть брак кандидата Ивана, но Пётр в нём не назван. Повторно импортируй это же дерево и скажи, что установлено."
    expected:
      - "Сопоставить идентификаторы и конкретную связь в GEDCOM, сводке и существующем деле; сохранить происхождение и статус каждой версии. Копия дерева не является новым независимым подтверждением."
      - "Не считать брак кандидата доказательством отцовства и не считать саму неподтверждённость опровержением; назвать следующий документ, который может связать Петра с родителями."
      - "Сохранить исходный файл, историю отклонённого отождествления и причину пересмотра; при повторном импорте не вернуть его как установленное и не перезаписать решения автоматически."

  - id: tree_import_preserves_provenance
    request: "Импортируй мой JSON с семейным деревом в существующее дело. В нём два разных человека с одинаковым именем и родственные связи без ссылок на документы. Отдельного конвертера GEDCOM нет."
    expected:
      - "Использовать доступные средства и существующие реестры; отсутствие отдельного конвертера не останавливает разбор JSON."
      - "Сохранить исходный файл как артефакт с происхождением и SHA-256, внешние ID и соответствие person_id; не перезаписать прежние решения."
      - "Сохранить одноимённых людей раздельно, связи внести как hypothesis с происхождением из дерева, не как независимые документальные подтверждения."

  - id: tree_import_living_and_partial_scope
    request: "В экспорте без дат смерти есть люди, родившиеся до и после выбранного автором порога 1935 года. Из 200 человек разобраны 40; остальная часть содержит неподдерживаемые поля. Можно считать старших умершими и объявить импорт завершённым?"
    expected:
      - "Не выводить смерть из произвольного порога или отсутствия даты смерти; сохранить неопределённость и ограничения для вероятно живых лиц."
      - "Сохранить неподдерживаемые поля и исходный файл, обозначить охват 40 из 200 и остаток."
      - "Продолжить доступное исследование разобранной части без требования нового формата или полного импорта."

  - id: parish_negative_scope_and_next_route
    request: "Смерть не найдена в книгах двух церквей за 14 лет; один год отсутствует, часть кадров нечитаема. В метриках детей сословная приписка отца меняется на солдатскую. Значит, он переехал и умер вне прихода?"
    expected:
      - "Ограничить отрицательный результат просмотренными книгами и отметить пробелы; длительность поиска не доказывает полноту или место смерти."
      - "Использовать смену приписки как наводку, а не доказательство переезда; выбрать полезный маршрут по сведениям о проживании и службе."
      - "Не требовать пересчёта всех записей или повторного чтения тех же книг без новых оснований."

  - id: parish_indirect_death_bounds
    request: "В брачной записи 1906 года Анна названа вдовой, имя прежнего мужа на фрагменте не видно. Пётр исчез из дворового списка 1905 года. Семья говорит, что Пётр умер осенью 1904 года, а ребёнок Анны родился весной 1905 года. Запишем смерть Петра до 1906 года как подтверждённую и отвергнем семейный рассказ из-за ребёнка?"
    expected:
      - "Не приписывать Пётру границу смерти из брака вдовы, пока прежний супруг не установлен; отсутствие в дворовом списке не доказывает смерть."
      - "Различить дату сообщения, события и регистрации, сохранить источники и альтернативы."
      - "Не считать рождение весной 1905 года само по себе опровержением смерти отца осенью 1904 года; проверить хронологию без выдумывания точных дат."

  - id: names_dictionary_variants_not_identity
    request: "В одном условном документе записан Егор, в другом — Георгий с той же фамилией. Справочник относит Егор к историческим формам имени Георгий. Достаточно ли исправить все записи на Георгий и объединить людей?"
    expected:
      - "Использовать связь форм для поиска и сохранить обе написанные формы и источник словарной справки; не переименовывать документы."
      - "Не устанавливать тождество людей только по словарю и совпадению фамилии; сопоставить дополнительные признаки и оставить кандидатов раздельно при недостатке данных."
      - "Не подменять отчество его догаданным вариантом и учитывать самостоятельное употребление форм."

  - id: confession_list_first_marriage_formula
    request: "В поздней исповедной росписи при вдове записано «дети её от первого брака». В более ранней росписи предполагаемые те же дети названы детьми другой женщины. Можно внести родительские связи в древо?"
    expected:
      - "Сохранить формулы обеих записей и отдельно проверить, к кому относится местоимение. Ясную формулу передать как утверждение самой ведомости."
      - "Оставить расхождение открытым и проверить тождество людей, принадлежность строк и возможную зависимость списков. Запись о вдовстве относится к браку женщины. Для отцовства детей нужны отдельные сведения."
      - "Выбрать относящиеся к спору записи рождения, крещения, брака или более раннюю роспись, в которой указаны родители. Оценивать родство по совокупности этих сведений."

  - id: child_death_formula_father_alive
    request: "В записи о смерти ребёнка назван двор предполагаемого отца. Пометы о смерти отца нет. Позднее возможный тёзка указан поручителем, но неясно, описано ли личное участие. Какие временные границы следуют из находок?"
    expected:
      - "Сохранить формулы и локаторы как наводки. Статус отца на дату записи о смерти ребёнка остаётся открытым."
      - "Проверить принадлежность записи семье, личное участие поручителя и дату действия. Подтверждённое участие отождествлённого человека даёт нижнюю границу его смерти."
      - "Если различающих признаков или ясной формулы мало, сохранить кандидатов и неопределённость."

  - id: transitional_metric_register_terms
    request: "В церковной метрике переходных лет женщина названа «гражданская жена», у свидетеля указан офицерский чин. В гражданской книге дата того же предполагаемого события отличается. Что можно записать о браке, службе и датах?"
    expected:
      - "Передать формулу из записи и сверить её употребление по графе, полному акту и соседним записям. Форму брака уточнить по брачному документу."
      - "Сохранить чин как написано. Проверить историческую юрисдикцию, военные документы и принадлежность записи человеку прежде, чем делать вывод о службе."
      - "Сохранить обе даты. Проверить календарь каждой серии по заголовкам, явным пометам или независимо датированным событиям."

  - id: familysearch_parent_pair_and_image_index
    request: |
      Для фильма с метрическими книгами полнотекстовый поиск недоступен,
      но у нужного кадра открыт Image Index. Выдача по паре родителей
      показала несколько детей. Поле фамилии отца похоже на отчество,
      одна запись прикреплена к персоне в дереве. Можно закрыть поиск семьи?
    expected:
      - "Проверить индекс кадра отдельно от полнотекстового поиска. Сверить чтение и место по доступному образу, сохранив существенные расхождения."
      - "Учитывать фактическое заполнение полей как поисковую наводку. Прикрепление записи к дереву не устанавливает тождество людей."
      - "Показать найденных детей и границы проверки, без вывода о полном составе семьи по индексной выдаче."
