skill: ex-ussr-kinship-research
version: "1.6.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: skill_feedback_at_end_of_work
    request: |
      Исследование по задаче закончено. По ходу работы выяснилось: справочник
      советовал искать дела о репрессиях в ведомственном архиве, а нужные дела
      уже переданы в областной государственный архив; приём просмотра тома
      консисторских копий по заголовкам приходов сработал, но нигде не описан.
      Подготовь итоговый ответ пользователю.
    expected:
      - "Дать итоговый ответ по задаче, а после него отдельный короткий блок «Замечания к навыку»."
      - "В блоке назвать устаревший совет о месте хранения дел и неописанный приём просмотра тома; отметить, что проверено на практике, а что нет."
      - "Формулировать обобщённо: без имён, дат и мест семьи и без данных живых людей."
      - "Не включать замечания в отчёт для семьи и не создавать issue или PR без согласия пользователя."

  - id: skill_feedback_nothing_to_add
    request: "Короткая проверка одной метрической записи прошла без затруднений, инструкции навыка подошли. Что написать в замечаниях к навыку?"
    expected:
      - "Сказать одной строкой, что замечаний нет."
      - "Не придумывать недостатки и не расширять ответ общими пожеланиями."

  - id: skill_feedback_user_wants_issue
    request: "Пользователь просит отправить твои замечания к навыку разработчику. В замечаниях упомянуты фамилия прадеда, село и шифр дела его семьи."
    expected:
      - "Перед отправкой обобщить текст: убрать фамилию, село, шифр семейного дела и другие сведения, по которым узнаётся семья."
      - "Оформить замечание как issue или PR в каноническом репозитории только после согласия пользователя на конкретный текст."
      - "Отделять проверенные наблюдения от предположений."
