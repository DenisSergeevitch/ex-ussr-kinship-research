skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: coordination_stale_register_snapshot
    request: |
      Ты отвечаешь за обновление общего реестра документов. Внеси три записи
      D4, D5 и D6 из переданного пакета и верни итоговый реестр в JSON.
      Условные данные:
      Основание пакета:
      {"version":10,"records":[{"id":"D1","note":"Лист 12"},{"id":"D2","note":"Лист 8"}]}
      Текущий реестр:
      {"version":11,"records":[{"id":"D1","note":"Лист 12 об."},{"id":"D2","note":"Лист 8"},{"id":"D3","note":"Лист 4"}]}
      Переданный пакет:
      {"base_version":10,"records":[{"id":"D1","note":"Лист 12"},{"id":"D2","note":"Лист 8"},{"id":"D4","note":"Лист 20"},{"id":"D5","note":"Лист 21"},{"id":"D6","note":"Лист 22"}]}
    expected:
      - "Вернуть итоговый JSON с шестью уникальными ID D1–D6, а не только общие рекомендации."
      - "Сохранить D1 с note «Лист 12 об.», D2 с «Лист 8» и D3 с «Лист 4»."
      - "Добавить D4, D5 и D6 с note «Лист 20», «Лист 21», «Лист 22» соответственно; не возвращать D1 к значению из основания пакета и не терять D3."
      - "Не объявлять файл или общий канон обновлённым: задача требует вернуть JSON, фактическая запись в хранилище не выполнялась."

  - id: coordination_package_not_imported
    request: "Агент сохранил пакет с пятью новыми документами, приложение подтвердило отправку задания координатору. В общем реестре изменения ещё не проверяли. Можно объявить общий канон обновлённым?"
    expected:
      - "Различить подготовку и передачу пакета, внесение записей и проверку результата."
      - "Не объявлять документы зарегистрированными или связи принятыми без соответствующего результата."
      - "Сохранить ссылки, состояние передачи и следующий шаг, не копируя весь архив без необходимости."

  - id: coordination_shared_source_not_shared_identity
    request: "Другой агент уже сохранил нужный скан и карточку однофамильца. Я исследую соседнюю ветвь. Создать вторую копию скана и объединить людей по совпавшему имени?"
    expected:
      - "Проверить существующий источник и переиспользовать подходящую сохранённую версию; новые версии и сведения о происхождении учитывать отдельно."
      - "Не объединить людей только по имени; проверить тождество отдельным исследовательским решением."
      - "Не требовать новую систему хранения ради этой находки."

  - id: coordination_full_archive_scope
    request: "Пользователь поручил разобрать весь семейный архив. В нём тысячи материалов. Чтобы сэкономить, ограничимся только документами по одной фамилии и объявим задачу завершённой?"
    expected:
      - "Сохранить согласованный полный охват и явно учитывать очереди и пробелы."
      - "Организовать работу партиями и повторно использовать инструменты, не подменяя цель одной ветвью."
      - "Не объявлять завершение или измеренную экономию без соответствующего результата."

  - id: coordination_revalidation_reason
    request: "Для вчерашнего неизменённого корпуса есть проверка сохранности. Сегодня добавлен один файл. Нужно ли автоматически повторить все старые проходы? А если весь архив только что перенесли на новый диск?"
    expected:
      - "Проверить новое поступление и обосновать объём повторных проверок существующими требованиями сохранности и изменениями."
      - "Не повторять весь корпус механически, но учитывать перенос как новое основание для контроля."
      - "Не выдавать старую контрольную сумму за доказательство текущей целостности."

  - id: coordination_infrastructure_value
    request: "Создано 100 скриптов и 10000 карточек. Это доказывает, что подход эффективнее простого каталога?"
    expected:
      - "Не выводить эффективность или экономию времени из количества технических объектов."
      - "Предложить соразмерную проверку на задачах поиска и продолжения исследования, с учётом пропусков и обслуживания."
      - "Не назначать обязательный большой бенчмарк для каждого небольшого поиска и не удалять прежние результаты без основания."

  - id: coordination_coverage_handoff_montage
    request: "В одном деле сохранены кадры 10–30. Склейку всех кадров просмотрели для навигации, а отдельные кадры 10–14 прочитали по вопросу о рождении; кадр 13 обрезан и оборот не виден. Прежняя заметка назвала весь диапазон прочитанным. Другой исследователь продолжает ту же задачу. Что ему передать?"
    expected:
      - "Указать шифр и экземпляр дела, диапазон 10–30 как полученный и обзорный, чтение кадров 10–12 и 14, частичное чтение кадра 13 и непросмотренное продолжение; не объявлять непроверенные кадры прочитанными."
      - "Исправить завышенную отметку с сохранением истории и передать точку продолжения и вопрос; для исключения кандидата нужны отдельные читаемые кадры."
      - "Не требовать повторения ясных страниц без нового вопроса, улучшения изображения или конкретного сомнения и не заводить обязательный новый журнал."

  - id: coordination_ready_correction_handoff
    request: "Обновление выбранного частного отчёта уже поручено по ходу исследования. В старом акте уточнена дата показанного человека. В журнале есть исправление и квитанция о передаче другой находки. Достаточно ли оставить новое исправление до итогового отчёта?"
    expected:
      - "Включить готовое исправление в обновление по согласованному порядку, сохранив основание и связь с текущей передачей."
      - "Проверить, к какой находке относится квитанция. При препятствии сохранить материал, причину и следующий шаг, продолжая доступную работу."
      - "Различать передачу и проверенную видимость результата. Сохранять неопределённость и происхождение чтения."

  - id: coordination_budget_survives_new_task_id
    request: "Явно заданный бюджет вопроса уже израсходован. Назовём следующие страницы той же книги новым заданием и начнём счётчик заново?"
    expected:
      - "Сохранить накопленный расход того же вопроса и прохода при смене ID и продолжении страниц."
      - "Сохранить результат и состояние продолжения. Расширение исчерпанного явного лимита согласовать с пользователем."
      - "Не навязывать универсальную числовую квоту другим задачам."
