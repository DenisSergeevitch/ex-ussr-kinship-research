skill: ex-ussr-kinship-research
version: "1.7.0"

# Условные ситуации для содержательной проверки, не автоматические unit-тесты.
logic_cases:
  - id: acquisition_finding_aid_not_personnel_record
    request: "В условном описании научно-справочного аппарата ЦДНИРО перечислена именная картотека. Поиск по странице не нашёл нужной фамилии, зато справочник содержит фонд партийной организации завода за нужный период. Можно утверждать, что родственник работал на заводе и был членом партии, а его личного дела в архиве нет?"
    expected:
      - "Различить страницу с описанием справочного аппарата, содержимое картотеки, опись и конкретный документ. Не считать поиск по странице поиском по картотеке; наличие онлайн-поиска проверять отдельно."
      - "По месту, организации и периоду проверить фондообразователя и состав описи; название фонда не доказывает работу, партийность или наличие личного дела конкретного человека."
      - "Не делать отрицательного вывода по непроверенному охвату; сохранить ограничение и при необходимости уточнить состав и доступ у архива по правилам переписки, не отправляя запрос без разрешения."

  - id: acquisition_archival_database_transcript_same_chain
    request: "В условной карточке базы «Без срока давности» есть архивный шифр, образы и ссылка «Текст архивного документа (.doc)». Файл разбирается как DOCX; в нём найдена нужная фамилия, изображения ещё не прочитаны. В сборнике обнаружена перепечатка того же документа. Это три независимых подтверждения? Другой запрос по селу ничего не вернул."
    expected:
      - "Использовать скачанный текст для навигации; проверить фактический формат, сохранить карточку, шифр и привязку к изображению, существенное чтение сверить со сканом. Успешный разбор DOCX не подтверждает точность транскрипции или полноту изображений."
      - "Не считать транскрипцию, образы и перепечатку одного документа независимыми подтверждениями; разные документы той же базы не объединять автоматически. Совпадение фамилии не устанавливает тождества людей или родства."
      - "Пустую выдачу ограничить проверенным запросом и доступным охватом; не объявлять отсутствие записи в фонде или отсутствие семьи в селе."

  - id: acquisition_familysearch_download_per_group
    request: "В предыдущих группах коллекции FamilySearch кнопка скачивания была отключена. Нужно прочитать несколько записей из другой группы. Начать со снимков экрана?"
    expected:
      - "Открыть нужный одиночный образ и проверить его кнопку скачивания. Условия другой группы на него не переносить."
      - "Если скачивание разрешено, воспользоваться штатной кнопкой и проверить открытие и соответствие файла нужному кадру."
      - "Если действует договорное ограничение, сохранить локатор и допустимые выписки. Не заменять запрещённое копирование снимком экрана; при необходимости проверить законный маршрут к копии."

  - id: acquisition_batch_stops_before_next_request
    request: "Подготовлены три именных запроса к одному архивному источнику. Первый ответ — HTTP 200 с требованием проверки робота. Что делать с двумя ещё не отправленными запросами?"
    expected:
      - "Остановить отправку после первого ответа. Второй и третий запросы оставить в плане."
      - "Если инструмент не может прервать партию после ответа, пользоваться отдельными запросами для этого маршрута."
      - "Записать выполненную попытку как барьер доступа. Дальнейшее действие с CAPTCHA выбрать по существующим правилам."

  - id: acquisition_hidden_ancestor_stops_input
    request: "У кнопки просмотра есть прямоугольник, но её предок скрыт. В одном вызове проверка выводит false, после неё вызывается click. Что делать и как описать результат проверки?"
    expected:
      - "Остановиться до клика. Разделить проверку и действие, если инструмент не останавливает вызов при false."
      - "При обычном появлении доступной цели проверить её на текущей странице. Учитывать скрытого предка, отключённое состояние и перекрытие."
      - "Подтвердить исходное состояние цели и отсутствие ввода для заявления об отказе до действия. Случай без тестового элемента оставляет проверку недоступной цели неподтверждённой."

  - id: acquisition_visible_label_is_not_automatically_bypass
    request: "Флажок визуально скрыт для оформления, но его видимая связанная метка доступна и не перекрыта. Можно ли использовать метку для штатного выбора при разрешённом просмотре?"
    expected:
      - "Использовать доступную метку для обычного действия в пределах доступа источника. Скрытый input и действующие ограничения оставлять без изменений."

  - id: acquisition_truncated_pdf_is_not_complete
    request: "Ответ публичного источника имеет HTTP 200, файл начинается с сигнатуры PDF и имеет SHA-256. Инструмент сообщает о прерванной передаче, а файл короче ожидаемого размера той же копии в том же представлении. Страницы не открываются. Как записать получение и охват?"
    expected:
      - "Зафиксировать неполную передачу и непрочитанные страницы. Статус, сигнатура и хеш описывают ответ и полученные байты."
      - "При необходимости проверить другую доступную разрешённую копию и её происхождение. Пригодный проверенный фрагмент можно использовать с точными границами."
      - "Отдельно описать состояние передачи, состав копии и прочитанное покрытие. Отсутствие находки по нечитаемому файлу оставляет поиск непроверенным."

  - id: acquisition_pdf_placement_before_ocr
    request: "Условный PDF содержит страницу с /Rotate=0, но матрица размещения поворачивает встроенный скан на 90 градусов. Извлечённые байты дали боковую картинку; OCR завершился без ошибки и вернул непустой текст, искомой фамилии в нём нет. Можно закрыть поиск по этой странице?"
    expected:
      - "Не считать нулевой поворот страницы или непустой OCR подтверждением правильной подготовки: сопоставить производную с отображаемой страницей, учитывая матрицу размещения и границы видимой области."
      - "Исправить затронутую производную корректным рендером или преобразованием; сохранить исходный PDF, прежний OCR, привязку к странице и причину пересмотра. Не требовать конкретного движка или повторной обработки незатронутых страниц."
      - "Не делать вывода об отсутствии фамилии по непригодному поиску; исправленный OCR также остаётся навигацией, а существенное чтение сверяется с изображением."

  - id: acquisition_ocr_effective_coverage
    request: "В условном каталоге три ярлыка: два ведут на один и тот же PDF A из двух страниц, третий — на PDF B из трёх страниц. Для каждой из пяти страниц сделаны четыре перекрывающиеся вырезки. Сохранены первоначальные 20 блоков OCR, четыре исправленных блока одной страницы и сводный текст из 20 действующих блоков. Проверены по изображениям только две вырезки. Как описать охват?"
    expected:
      - "Различить три ярлыка, два PDF, пять исходных страниц и 20 действующих областей OCR; сохранить оба ярлыка PDF A, не считать их разными документами или независимыми подтверждениями."
      - "Четыре исправленных блока заменяют прежние для одной страницы; сводный текст повторяет действующие результаты. Не складывать все сохранённые блоки в число уникальных страниц или действующих областей; сохранить соответствие и историю версий."
      - "Ограничить визуальную проверку двумя вырезками; не объявлять пять страниц полностью прочитанными, OCR точным или фамилию отсутствующей во всём корпусе."

  - id: acquisition_faint_page_not_blank
    request: "OCR вернул пустой текст, доля тёмных пикселей ниже порога. При просмотре страницы заметна бледная приписка. Исключить страницу как пустую?"
    expected:
      - "Не исключать страницу по совпадению двух технических сигналов; проверить видимую приписку."
      - "Сохранить изображение и результат адресного чтения или отметку о неразборчивости."
      - "Порог и пустое OCR не считать доказательством отсутствия текста."

  - id: acquisition_stale_viewer_frame
    request: "После перехода с кадра 25 на 26 URL и поле номера показывают 26, но в области изображения ещё видна отметка кадра 25. Сохрани страницу 26 для ссылки на запись."
    expected:
      - "Дождаться и проверить фактически загруженное изображение; не присвоить кадру 25 адрес кадра 26."
      - "Если соответствие проверить невозможно, обозначить неопределённость и не заявлять получение нужной страницы."

  - id: acquisition_tile_extent
    request: "Сборка из 56 плиток имеет размер 2049×1655 и ноль внутренних пропусков. В просмотрщике справа виден ещё один столбец текста за границей сборки. Можно назвать её полной копией разворота?"
    expected:
      - "Различить полноту полученного прямоугольника и охват страницы; не назвать сборку полной."
      - "Если нужен весь разворот, получить недостающую область и проверить границы; если достаточно фрагмента, обозначить его охват."
      - "Сохранить первую сборку и происхождение новой версии, не объявлять их архивными оригиналами полного разрешения."

  - id: acquisition_distinct_files_same_record
    request: "Кадры 306 и 307 имеют разные SHA-256, но после сопоставления оба показывают лист 259 с теми же девятью актами. На правой половине 308 начинается другая книга. Сколько новых актов добавляет кадр 307 и как описать границу?"
    expected:
      - "Кадр 307 не добавляет новых актов; сохранить обе разные фотографии и их адреса."
      - "Не приравнять номер кадра к номеру листа и не считать разные хеши доказательством разных записей."
      - "Границу книг указать по половинам кадра 308; не переносить обе половины в одну книгу автоматически."

  - id: acquisition_content_not_extension
    request: "93 полученных файла названы .png и имеют сохранённые хеши. Декодер определяет их как JPEG. Нужно ли конвертировать их в PNG, чтобы отчёт стал верным?"
    expected:
      - "Исправить описание фактического формата затронутой партии, сохранив прежние метаданные."
      - "Сохранить исходные байты и имена; не выполнять конвертацию только ради соответствия старому описанию."
      - "Не распространять эту адресную проверку на весь архив без нового основания."

  - id: acquisition_response_and_block_completeness
    request: "Запрос карточки вернул HTTP 200 и текст ошибки. Другой ответ оборвался после полностью закрытой таблицы: в ней 82 строки, счётчик сервиса тоже 82, отсутствует только подвал. Как учесть результаты?"
    expected:
      - "Первый ответ не считать полученной карточкой или отрицательным историческим результатом."
      - "Для второго различить полный блок таблицы и неполный HTTP-ответ; использовать проверенный блок с ограничением охвата."
      - "Полноту ответа или блока не приравнивать к полноте исторической коллекции."

  - id: acquisition_pdf_glyph_mapping
    request: "В PDF есть извлекаемый текст, но видимой кириллице соответствуют бессмысленные символы. Поиск фамилии ничего не находит. Можно закрыть поиск по книге?"
    expected:
      - "Не делать отрицательного вывода по непригодному текстовому слою."
      - "Сопоставить текст с изображением и использовать отдельное OCR или чтение нужных страниц; сохранить оригинал и ошибочное извлечение."
      - "Обозначить фактически проверенный охват и не считать успешное OCR доказательством точности всех чтений."

  - id: acquisition_selective_preservation
    request: "При просмотре разрешённой коллекции нашли возможную запись о семье, а другая запись исключает кандидата по указанному в ней месту. Несколько посторонних записей просмотрены; подходящий сохранённый снимок первой записи уже есть. Для второй встроенная загрузка недоступна, а архив целиком не помещается на диск. Что сохранить до ухода со страницы?"
    expected:
      - "Повторно использовать пригодный снимок первой записи; сохранить значимое исключение разрешённым читаемым способом с контекстом и локатором, не копируя посторонние записи или весь архив."
      - "Проверить сохранённый файл, формат, читаемость и соответствие нужной странице; при невозможности сохранения указать причину и точку возврата и продолжить доступные задачи."
      - "Оценить место для целевой загрузки и производных; просмотр не означает права обхода ограничений или публикации."

  - id: acquisition_forwarded_photo_date
    request: "Из семейного чата выгружено старое фото с подписью «Выпуск гимназии»; файл называется photo_17@11-05-2020_14-48-02.jpg. Записать 11.05.2020 датой снимка?"
    expected:
      - "По одному имени файла нельзя установить ни дату съёмки, ни точное время пересылки; значение даты проверить по доступным полям экспорта и происхождению файла, а при нехватке данных оставить неизвестным."
      - "Датировать снимок по подписи, содержанию и происхождению как гипотезу с основанием."
      - "Установленную дату сообщения или цифровой копии хранить отдельно от датировки снимка; сохранить исходный файл, его имя и относящийся к нему фрагмент сообщения без посторонней переписки."

  - id: acquisition_eais_stalled_session
    request: "В оплаченной сессии областной ЕАИС перестал отвечать поиск. Ещё нужно открыть карточку известного дела и проверить другие источники. Повторить поиск в новой вкладке?"
    expected:
      - "Не добавлять повторные запросы в той же сессии и не приписывать сбой серверной очереди без подтверждения."
      - "Зафиксировать запрос и точку возврата, продолжить доступные маршруты. После восстановления открыть известное дело по карточке или точечным поиском. Отсутствие ответа считать ограничением проверки."
