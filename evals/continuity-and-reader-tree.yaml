skill: ex-ussr-kinship-research
version: "1.32.0"

# Все люди, даты, числа и идентификаторы в примерах вымышлены.
# Условные сценарии для содержательной проверки; не автоматические unit-тесты.
logic_cases:
  - id: continuity_corrected_name
    request: |
      В старом отчёте запись прочитана как имя сына. В реестре и журнале
      исправлений записано: это дочь, ссылка на читаемый кадр A-0012.
      Вернувшись после перерыва, спросим ли снова родственника о прежнем сыне,
      и заведём ли ему отдельную карточку?
    expected:
      - "Проверить актуальную запись и основание исправления; не возрождать старого кандидата без новых оснований."
      - "Сохранить историю чтения и проверить зависимые выводы, не объявлять повторную визуальную проверку выполненной без неё."

  - id: continuity_disconnected_documented_family
    request: |
      Для отчёта пользователь выбрал только связанную семью; его рассказ о
      родителях исходного человека принят с явной атрибуцией. Найдена другая
      семья XIX века: её внутренние связи подтверждены метриками, но мост
      к исходным людям пока гипотетический. Показать всех как предков?
    expected:
      - "Сохранить новую семью и её ID в исследовательских материалах отдельно от связанного читательского дерева."
      - "Не исключать уже принятую семейную связь только за отсутствие документа и не повышать её до документальной."
      - "Не считать документальность внутренних связей доказательством моста."

  - id: continuity_relative_before_feed
    request: |
      Дерево обновляется по правилу документальных или атрибутированных
      семейных связей. Пользователь назвал сестру человека из ядра;
      однофамилица уже есть среди кандидатов, тождество не доказано.
      Хватит ли записать сестру в комментарий и сразу сообщить о новом человеке?
    expected:
      - "Проверить дубли без слияния однофамилиц; оформить отдельную карточку или обоснованно использовать существующую."
      - "Записать заявленную связь с её происхождением и включить в читательский граф до события ленты."
      - "Не выдавать семейное дополнение за документальное подтверждение; повторная сборка не создаёт второе событие."

  - id: continuity_late_repeated_child_name
    request: |
      В рождении указан сын, а в позднем акте отца упомянут сын с тем же именем.
      Документы действительно относятся к отцу. Доказано, что это тот же ребёнок
      и ранее найденный младенец выжил?
    expected:
      - "Отделить принадлежность документов от тождества детей и возможного повторного имени."
      - "Не утверждать выживание без дополнительного основания; сохранить отдельный вопрос."

  - id: continuity_stopped_runtime
    request: |
      Пользователь поручил продолжать исследование до предела источников.
      Остались доступные книги, но текущий запуск завершается по лимиту среды;
      фоновых задач нет. Можно написать «продолжаю, не останавливаясь»?
    expected:
      - "Не обещать работу после ответа без действующего механизма."
      - "Сохранить охват, находки, очередь и точку продолжения, назвать реальную причину остановки."
      - "Не объявлять доступные источники исчерпанными и не создавать расписание без полномочий."

  - id: continuity_partial_history_handoff
    request: |
      Инструмент вернул только последние 20 сообщений; ранняя история
      известна из резюме. На диске есть более новые реестры и старый план.
      Подготовь передачу дела: это полный перенос и актуален ли старый план?
    expected:
      - "Назвать охват и происхождение: выдержки и резюме не полная стенограмма."
      - "Сверить старый план с актуальными файлами; не восстанавливать отсутствующие факты догадками."
      - "Сохранить значимые результаты и ограничения в существующих носителях, указать первый шаг восстановления."
      - "Не превращать предложение агента в решение владельца."

  - id: continuity_registry_partial_write
    request: |
      В CSV 200 строк и дополнительный неизвестный столбец. Скрипт
      перезаписи упал после 80 строк. Можно удалить столбец и считать
      восстановление успешным по числу ссылок в HTML?
    expected:
      - "Не отбрасывать столбец и не продолжать повреждение оригинала; использовать резервную версию и проверку различий."
      - "Проверить временный файл, схему, ID, строки и удаления перед заменой."
      - "Структурная проверка HTML не подтверждает смысловую сохранность реестра."

  - id: browser_close_completed_owned_tabs
    request: |
      После партии исследования открыты 12 созданных агентом вкладок:
      8 завершённых поисков и источников, 2 дубликата и 2 текущих скана.
      Находки пока записаны не все. Как освободить браузер?
    expected:
      - "Сначала сохранить нужные URL, ID/кадры, находки и продолжение в существующих носителях."
      - "Закрыть ненужные завершённые вкладки и дубли; сохранить текущие нужные сканы и переиспользовать страницы."
      - "Проверить результат закрытия, не обещать измеренное освобождение RAM без измерений."

  - id: browser_preserve_user_and_pending_tabs
    request: |
      Открыты вкладка пользователя, несохранённая форма другого исполнителя,
      актуальная CAPTCHA для пользователя и завершённый агентский поиск.
      Можно закрыть всё, раз пользователь просит экономить память?
    expected:
      - "Закрыть только собственный ненужный поиск после сохранения результатов."
      - "Сохранить чужие вкладки, ввод и актуальную CAPTCHA; не очищать сессии и не плодить копии."
      - "Если закрытие недоступно, назвать ограничение и продолжить исследование без бесконечных попыток."


  - id: continuity_branch_priority_without_quota
    request: |
      Пользователь поручил многоветвевое исследование. В одной ветви ещё
      есть полезная доступная книга; в другой давно ждёт проверка, способная
      разрешить существенное противоречие. Числовых квот или лимитов нет.
      Нужно ли остановиться до следующего ответа или добыть заданное число людей?
    expected:
      - "Выбрать следующий полезный шаг по цели, противоречию, доступности и затратам, учитывая оставленную ветвь."
      - "Сохранить продолжение книги, не объявляя её просмотренной; не вводить обязательную квоту людей или документов."
      - "Продолжать доступную работу в порученном объёме без вопроса после каждой партии."
